name: Find Goanna base revision for patches

on:
  workflow_dispatch:

jobs:
  find-base:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Check out K-Meleon-R
        uses: actions/checkout@v4

      - name: Full-history clone of the engine
        shell: bash
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/roytam1/palemoon27.git goanna
          cd goanna
          git branch -r | head -20

      - name: Locate the base commit from patch blob hashes
        shell: bash
        working-directory: goanna
        run: |
          find_blob() {  # $1=short blob hash  $2=path
            git log --all --format='%H' -- "$2" | while read -r c; do
              b=$(git rev-parse --short=9 "$c:$2" 2>/dev/null) || continue
              [ "$b" = "$1" ] && echo "$c"
            done
          }
          echo "=== commits where modules/libpref/Makefile.in blob == f8965daaf"
          find_blob f8965daaf modules/libpref/Makefile.in | head -5 | while read -r c; do
            git log -1 --format="$c %ad %s" --date=short "$c"
            git branch -r --contains "$c" | head -5
          done
          echo "=== commits where nsResProtocolHandler.cpp blob == 97788082f"
          find_blob 97788082f netwerk/protocol/res/nsResProtocolHandler.cpp | head -5 | while read -r c; do
            git log -1 --format="$c %ad %s" --date=short "$c"
          done