name: release-addon
on:
  push:
    branches: [palemoon-addon]
    paths: ['.github/workflows/release-addon.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach assets to
        default: v76.5.5-r6
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XPI
        run: python pm-addon/build.py
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory pm-addon/installer/_s -Force | Out-Null
          Copy-Item pm-addon/kmeleon-r-startpage.xpi pm-addon/installer/
          Copy-Item NOTICE-K-Meleon-R.md pm-addon/installer/ -ErrorAction SilentlyContinue
          if (-not (Test-Path pm-addon/installer/NOTICE-K-Meleon-R.md)) { git show origin/copilot/kmeleon-r-browser-build:NOTICE-K-Meleon-R.md | Set-Content pm-addon/installer/NOTICE-K-Meleon-R.md }
          Copy-Item pm-addon/README.md pm-addon/installer/
      - name: Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=r6 pm-addon/installer/kmr-setup.nsi
          if ($LASTEXITCODE) { exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          $d = "K-Meleon-R-r6-PaleMoon-addon"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item pm-addon/installer/kmeleon-r-startpage.xpi, pm-addon/installer/NOTICE-K-Meleon-R.md, pm-addon/installer/README.md $d
          Compress-Archive $d "$d.zip"
      - name: Upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v76.5.5-r6" pm-addon/installer/K-Meleon-R-r6-PaleMoon-setup.exe K-Meleon-R-r6-PaleMoon-addon.zip --clobber
