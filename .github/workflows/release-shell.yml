name: release-shell
on:
  push:
    branches: [kmeleon-r]
    paths: ['kmr-shell/**', 'kmr-shell.tests/**', '.github/workflows/release-shell.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test search routing
        shell: pwsh
        run: |
          dotnet test kmr-shell.tests/KMeleonR.Search.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test kmr-shell.tests/start-page.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish kmr-shell/kmr-shell.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item kmr-shell/NOTICE-K-Meleon-R.md publish/; Remove-Item publish/*.xml
          Copy-Item kmr-shell/README.md publish/README.md
          Get-ChildItem publish | Select Name, Length
      - name: Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=r15 /DSRC="$PWD\publish" kmr-shell/setup.nsi
          if ($LASTEXITCODE) { exit 1 }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item kmr-shell/cursor_lockdown.ps1, kmr-shell/harden_against_gem_os.ps1 publish/
          Compress-Archive publish/* K-Meleon-R-r15-x64-portable.zip
          $s = Get-ChildItem -Recurse -Filter K-Meleon-R-r15-x64-setup.exe | Select -First 1
          if ($s.DirectoryName -ne $PWD.Path) { Move-Item $s.FullName . -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: r15
          path: |
            K-Meleon-R-r15-x64-portable.zip
            K-Meleon-R-r15-x64-setup.exe
