name: Build K-Meleon-R browser x64

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'configure or build'
        default: 'configure'
      mozbuild:
        description: 'MozillaBuild version'
        default: '2.2.0'

env:
  GOANNA_SHA: 3c1231618ac46f8172c7a5fcfd0ccbaba9690967

jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          mkdir goanna && cd goanna
          git init -q
          git remote add origin https://github.com/roytam1/palemoon27.git
          git fetch -q --depth 1 origin $GOANNA_SHA
          git checkout -q FETCH_HEAD
          git log -1 --format=%H

      - name: Add K-Meleon application sources
        shell: bash
        working-directory: goanna
        run: cp -a ../k-meleon ./kmeleon

      - name: Backdate sources so cached objects stay valid
        shell: bash
        working-directory: goanna
        run: find . -path ./.git -prune -o -type f -exec touch -d 2020-01-01 {} +

      - name: Apply K-Meleon patches
        shell: bash
        working-directory: goanna
        run: |
          for p in goanna-xulrunner-km-adapt goanna-gre-prefs nsResProtocolHandler-old-behaviour; do
            echo "== $p"; patch -p1 -F3 -l < ../$p.diff
          done
          find . -name '*.rej' -o -name '*.orig' | head

      - name: Drop redundant PAC hunks (base already checks args)
        shell: bash
        working-directory: goanna
        run: |
          sed -i '/JS::JS_RequireArgsAtLeast/,+1d' netwerk/base/ProxyAutoConfig.cpp
          grep -n 'RequireArgsAtLeast\|requireAtLeast' netwerk/base/ProxyAutoConfig.cpp

      - name: Avoid js/public/HeapAPI.h shadowing the SDK heapapi.h
        shell: bash
        working-directory: goanna
        run: |
          sed -i "/'\/js\/public',/d" js/ipc/moz.build
          grep -n -A6 LOCAL_INCLUDES js/ipc/moz.build

      - name: Drop xulrunner stub (CRT mismatch, unused by K-Meleon)
        shell: bash
        working-directory: goanna
        run: |
          grep -n stub xulrunner/moz.build || true
          sed -i "/'stub'/d" xulrunner/moz.build
          printf "\nif CONFIG['OS_ARCH'] == 'WINNT':\n    LDFLAGS += ['-FORCE:MULTIPLE']\n" >> toolkit/library/moz.build
          grep -n stub xulrunner/moz.build || true

      - name: Enable Windows 10 SDK Direct3D and relax STL checks
        shell: bash
        working-directory: goanna
        run: |
          sed -i 's/0x0603[*])/0x0603*|0x0A00*)/' configure.in
          grep -n -A4 'case "$MOZ_WINSDK_MAXVER"' configure.in
          grep -rl "exception wrapping doesn't understand" --include=configure --include=configure.in --include=old-configure* . || true
          for f in $(grep -rl "exception wrapping doesn't understand" --include=configure --include=configure.in --include=old-configure* .); do
            sed -i -E "s/(AC_MSG_ERROR|\{ \{ echo \"configure: error:)(.*)exception wrapping doesn't understand[^]]*/AC_MSG_WARN([exception wrapping disabled/" "$f"
          done
          sed -i 's/^MOZ_REQUIRE_ALL_D3DCS=1/MOZ_REQUIRE_ALL_D3DCS=/' configure.in
          grep -n 'MOZ_REQUIRE_ALL_D3DCS=' configure.in
          grep -rn "exception wrapping" --include=configure --include=configure.in --include=old-configure* . | head

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $v = '${{ inputs.mozbuild }}'
          curl.exe -sSL -o mb.exe "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$v.exe"
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S','/D=C:\mozilla-build'
          Get-ChildItem C:\mozilla-build -Name | Select-Object -First 40
          Get-ChildItem C:\mozilla-build\python* -Name -ErrorAction SilentlyContinue | Select-Object -First 5

      - name: Install yasm
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\yasm | Out-Null
          $urls = 'https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0-win64.exe','https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe'
          foreach ($u in $urls) {
            curl.exe -sSL -o C:\yasm\yasm.exe $u
            "$u -> $((Get-Item C:\yasm\yasm.exe).Length) bytes"
            if ((Get-Item C:\yasm\yasm.exe).Length -gt 100000) { break }
          }
          & C:\yasm\yasm.exe --version
          Test-Path C:\Windows\System32\msvcr100.dll
          choco install vcredist2010 -y --no-progress
          Test-Path C:\Windows\System32\msvcr100.dll
          & C:\yasm\yasm.exe --version; "yasm exit $LASTEXITCODE"
          Copy-Item C:\yasm\yasm.exe C:\mozilla-build\yasm\yasm.exe -Force
          "yasm exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { choco install yasm -y --no-progress; Get-Command yasm* -All | Format-List Source }
      - name: Install v142 ATL/MFC headers
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path $installer)) { throw "Visual Studio Installer not found: $installer" }
          $arguments = 'modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL --quiet --norestart'
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Failed to install v142 ATL/MFC components (exit $($process.ExitCode))" }
          $toolset = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.29*" -Directory | Where-Object { (Test-Path (Join-Path $_.FullName "atlmfc\include\afxwin.h")) -and (Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h")) } | Select-Object -First 1
          if (-not $toolset) { throw "v142 ATL/MFC headers were not installed" }

      - name: Write mozconfig
        shell: bash
        run: |
          cat > goanna/mozconfig <<'EOF'
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-x64
          ac_add_options --enable-application=kmeleon
          ac_add_options --enable-shared-js
          ac_add_options --target=x86_64-pc-mingw32
          ac_add_options --host=x86_64-pc-mingw32
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-updater
          ac_add_options --disable-crashreporter
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-installer
          ac_add_options --disable-webrtc
          ac_add_options --disable-require-d3d-compilers
          ac_add_options --disable-webgl
          mk_add_options MOZ_MAKE_FLAGS="-j4 -k"
          export YASM=/c/mozilla-build/yasm/yasm.exe
          export CFLAGS=-DNOMINMAX
          export CXXFLAGS=-DNOMINMAX
          EOF

      - name: Restore object cache
        uses: actions/cache/restore@v4
        with:
          path: goanna/obj-x64
          key: obj-none
          restore-keys: obj-

      - name: Use glue-compatible refcount declarations
        shell: bash
        working-directory: goanna
        run: |
          for header in gfx/thebes/gfxVR.h obj-x64/dist/include/gfxVR.h; do
            if [ -f "$header" ]; then
              sed -i '/^#include "nsISupportsImpl.h"$/d' "$header"
              if ! grep -q 'NS_INLINE_DECL_REFCOUNTING(VRHMDInfo)' "$header" && grep -q 'NS_INLINE_DECL_THREADSAFE_REFCOUNTING(VRHMDInfo)' "$header"; then
                sed -i '/NS_INLINE_DECL_THREADSAFE_REFCOUNTING(VRHMDInfo)/c\
          #ifdef XPCOM_GLUE\
            NS_INLINE_DECL_REFCOUNTING(VRHMDInfo)\
          #else\
            NS_INLINE_DECL_THREADSAFE_REFCOUNTING(VRHMDInfo)\
          #endif' "$header"
              fi
              grep -q 'NS_INLINE_DECL_REFCOUNTING(VRHMDInfo)' "$header" || { echo "Failed to patch refcount declaration in $header"; exit 1; }
            fi
          done
          for header in xpcom/components/ModuleUtils.h obj-x64/dist/include/mozilla/ModuleUtils.h; do
            if [ -f "$header" ]; then
              if ! grep -q 'NS_DECL_ISUPPORTS' "$header" && grep -q '^[[:space:]]*NS_DECL_THREADSAFE_ISUPPORTS[[:space:]]*$' "$header"; then
                sed -i '/^[[:space:]]*NS_DECL_THREADSAFE_ISUPPORTS[[:space:]]*$/c\
          #ifdef XPCOM_GLUE\
            NS_DECL_ISUPPORTS\
          #else\
            NS_DECL_THREADSAFE_ISUPPORTS\
          #endif' "$header"
              fi
              grep -q 'NS_DECL_ISUPPORTS' "$header" || { echo "Failed to patch module refcount declaration in $header"; exit 1; }
            fi
          done

      - name: Keep restored objdir from being clobbered
        shell: bash
        run: if [ -f goanna/obj-x64/CLOBBER ]; then touch goanna/obj-x64/CLOBBER; fi; ls goanna/obj-x64 2>/dev/null | head -5 || true
      - name: Rebuild K-Meleon sources against cached engine
        shell: bash
        run: find goanna/kmeleon -type f \( -name '*.cpp' -o -name '*.h' -o -name 'moz.build' \) -exec touch {} +

      - name: Configure / build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29
          set MOZCONFIG=%CD%\goanna\mozconfig
          set PATH=C:\yasm;C:\mozilla-build\yasm;C:\mozilla-build\python;C:\mozilla-build\python27;%PATH%
          set MOZ_NO_RESET_PATH=1
          set MOZILLABUILD=C:\mozilla-build
          set MOZ_TOOLS=C:\mozilla-build\moztools-x64
          set PATH=C:\mozilla-build\moztools-x64\bin;%PATH%
          set STAGE=${{ inputs.stage }}
          set RETRY_DIRS=js/ipc
          set INCLUDE_TRACE=js/ipc
          C:\mozilla-build\msys\bin\bash.exe -l %GITHUB_WORKSPACE%\.github\scripts\engine-build.sh > build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log | more +0 > nul
          exit /b %RC%

      - name: Save object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: goanna/obj-x64
          key: obj-${{ github.run_id }}

      - name: Log tail
        if: always()
        shell: bash
        run: tail -n 80 build.log || true

      - name: Verify K-Meleon browser output
        if: success() && inputs.stage == 'build'
        shell: pwsh
        run: |
          $bin = 'goanna\obj-x64\dist\bin'
          $redistRoot = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC' -Directory |
            Where-Object { $_.Name -like '14.29*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $redistRoot) { throw 'The v142 runtime redistributables were not found' }
          foreach ($component in 'Microsoft.VC142.CRT', 'Microsoft.VC142.MFC') {
            $runtimePath = Join-Path $redistRoot.FullName "x64\$component"
            $runtimeDlls = Get-ChildItem $runtimePath -File -Filter '*.dll'
            if (-not $runtimeDlls) { throw "No runtime DLLs found in $runtimePath" }
            Copy-Item $runtimeDlls.FullName $bin -Force
          }
          $app = Get-ChildItem $bin -File -Filter '*meleon*.exe' | Select-Object -First 1
          if (-not $app) { throw "K-Meleon executable was not produced in $bin" }
          foreach ($file in 'xul.dll', 'mozglue.dll', 'mozjs.dll') {
            if (-not (Test-Path (Join-Path $bin $file))) { throw "Missing runtime file: $file" }
          }
          Write-Output "Verified $($app.FullName)"

      - name: Upload test browser
        if: success() && inputs.stage == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: K-Meleon-R-x64-browser
          path: goanna/obj-x64/dist/bin/
          if-no-files-found: error
          retention-days: 14

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-log
          path: build.log
