name: Build Goanna engine x64

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'configure or build'
        default: 'configure'
      mozbuild:
        description: 'MozillaBuild version'
        default: '2.2.0'

env:
  GOANNA_SHA: 3c1231618ac46f8172c7a5fcfd0ccbaba9690967

jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Fetch engine source
        shell: bash
        run: |
          mkdir goanna && cd goanna
          git init -q
          git remote add origin https://github.com/roytam1/palemoon27.git
          git fetch -q --depth 1 origin $GOANNA_SHA
          git checkout -q FETCH_HEAD
          git log -1 --format=%H

      - name: Apply K-Meleon patches
        shell: bash
        working-directory: goanna
        run: |
          for p in goanna-xulrunner-km-adapt goanna-gre-prefs nsResProtocolHandler-old-behaviour; do
            echo "== $p"; patch -p1 -F3 -l < ../$p.diff
          done
          find . -name '*.rej' -o -name '*.orig' | head

      - name: Relax MSVC STL wrapping check (VS2019 STL lacks the hooks)
        shell: bash
        working-directory: goanna
        run: |
          grep -rl "exception wrapping doesn't understand" --include=configure --include=configure.in --include=old-configure* . || true
          for f in $(grep -rl "exception wrapping doesn't understand" --include=configure --include=configure.in --include=old-configure* .); do
            sed -i -E "s/(AC_MSG_ERROR|\{ \{ echo \"configure: error:)(.*)exception wrapping doesn't understand[^]]*/AC_MSG_WARN([exception wrapping disabled/" "$f"
          done
          sed -i 's/^MOZ_REQUIRE_ALL_D3DCS=1/MOZ_REQUIRE_ALL_D3DCS=/' configure.in
          grep -n 'MOZ_REQUIRE_ALL_D3DCS=' configure.in
          grep -rn "exception wrapping" --include=configure --include=configure.in --include=old-configure* . | head

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $v = '${{ inputs.mozbuild }}'
          curl.exe -sSL -o mb.exe "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$v.exe"
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S','/D=C:\mozilla-build'
          Get-ChildItem C:\mozilla-build -Name | Select-Object -First 40
          Get-ChildItem C:\mozilla-build\python* -Name -ErrorAction SilentlyContinue | Select-Object -First 5

      - name: Install yasm
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\yasm | Out-Null
          $urls = 'https://github.com/yasm/yasm/releases/download/v1.3.0/yasm-1.3.0-win64.exe','https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe'
          foreach ($u in $urls) {
            curl.exe -sSL -o C:\yasm\yasm.exe $u
            "$u -> $((Get-Item C:\yasm\yasm.exe).Length) bytes"
            if ((Get-Item C:\yasm\yasm.exe).Length -gt 100000) { break }
          }
          & C:\yasm\yasm.exe --version
          "yasm exit $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { choco install yasm -y --no-progress; Get-Command yasm* -All | Format-List Source }
      - name: Write mozconfig
        shell: bash
        run: |
          cat > goanna/mozconfig <<'EOF'
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-x64
          ac_add_options --enable-application=xulrunner
          ac_add_options --target=x86_64-pc-mingw32
          ac_add_options --host=x86_64-pc-mingw32
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-updater
          ac_add_options --disable-crashreporter
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-installer
          ac_add_options --disable-webrtc
          ac_add_options --disable-require-d3d-compilers
          mk_add_options MOZ_MAKE_FLAGS="-j4 -k"
          export YASM=/c/yasm/yasm.exe
          export CFLAGS=-DNOMINMAX
          export CXXFLAGS=-DNOMINMAX
          EOF

      - name: Restore object cache
        uses: actions/cache/restore@v4
        with:
          path: goanna/obj-x64
          key: obj-none
          restore-keys: obj-

      - name: Configure / build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.29
          set MOZCONFIG=%CD%\goanna\mozconfig
          set PATH=C:\yasm;C:\mozilla-build\python;C:\mozilla-build\python27;%PATH%
          set MOZ_NO_RESET_PATH=1
          set MOZILLABUILD=C:\mozilla-build
          set MOZ_TOOLS=C:\mozilla-build\moztools-x64
          set PATH=C:\mozilla-build\moztools-x64\bin;%PATH%
          set STAGE=${{ inputs.stage }}
          set RETRY_DIRS=netwerk/base js/ipc
          C:\mozilla-build\msys\bin\bash.exe -l %GITHUB_WORKSPACE%\.github\scripts\engine-build.sh > build.log 2>&1
          set RC=%ERRORLEVEL%
          type build.log | more +0 > nul
          exit /b %RC%

      - name: Save object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: goanna/obj-x64
          key: obj-${{ github.run_id }}

      - name: Log tail
        if: always()
        shell: bash
        run: tail -n 80 build.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-log
          path: build.log
